<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard — Property-Based Tests</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; }

      body {
        font-family: system-ui, -apple-system, sans-serif;
        background: #0f1117;
        color: #e2e8f0;
        margin: 0;
        padding: 2rem;
        line-height: 1.5;
      }

      h1 {
        font-size: 1.5rem;
        margin: 0 0 1.5rem;
        color: #a5b4fc;
        border-bottom: 1px solid #2d3748;
        padding-bottom: 0.75rem;
      }

      #test-output { max-width: 820px; }

      .summary {
        display: inline-block;
        padding: 0.5rem 1.25rem;
        border-radius: 0.5rem;
        font-size: 1rem;
        margin-bottom: 1.5rem;
      }
      .summary.all-pass  { background: #1a3a2a; color: #6ee7b7; border: 1px solid #34d399; }
      .summary.has-fail  { background: #3a1a1a; color: #fca5a5; border: 1px solid #ef4444; }
      .fail-count { color: #f87171; }

      .test-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }

      .test-list li {
        padding: 0.6rem 1rem;
        border-radius: 0.375rem;
        font-size: 0.9rem;
      }

      .test-pass { background: #0d2b1a; border-left: 4px solid #34d399; }
      .test-fail { background: #2b0d0d; border-left: 4px solid #ef4444; }

      .badge {
        display: inline-block;
        font-size: 0.7rem;
        font-weight: 700;
        letter-spacing: 0.05em;
        padding: 0.1rem 0.4rem;
        border-radius: 0.25rem;
        margin-right: 0.5rem;
        vertical-align: middle;
      }
      .test-pass .badge { background: #166534; color: #bbf7d0; }
      .test-fail .badge { background: #7f1d1d; color: #fecaca; }

      .test-name { vertical-align: middle; }

      .error-detail {
        margin: 0.5rem 0 0 2rem;
        padding: 0.5rem 0.75rem;
        background: #1a0808;
        border: 1px solid #7f1d1d;
        border-radius: 0.25rem;
        font-size: 0.8rem;
        color: #fca5a5;
        white-space: pre-wrap;
        word-break: break-word;
      }
    </style>
  </head>
  <body>
    <h1>Todo Life Dashboard — Property-Based Tests</h1>
    <div id="test-output">
      <p style="color:#94a3b8">Loading tests…</p>
    </div>

    <!--
      app.js must be loaded first so window._dashboard is available.
      It registers a DOMContentLoaded listener for initStorage/initGreeting/etc.,
      which will fire after this page's DOM is ready — those DOM IDs are absent
      here, but app.test.js provides temporary stubs via withDomStubs() for any
      test that calls DOM-touching functions.
    -->
    <script src="js/app.js"></script>
    <script src="js/app.test.js"></script>
  </body>
</html>
